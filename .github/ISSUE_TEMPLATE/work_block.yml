name: Work Block
description: Define un delta compacto para una capacidad cohesiva
title: "[WORK-BLOCK] "
labels: [workflow:active]
body:
  - type: markdown
    attributes:
      value: "Un único Work Block abierto puede llevar workflow:active. Declare deltas; los defaults viven en docs/development_protocol.md."
  - type: input
    id: work_block
    attributes: {label: Work Block, placeholder: "BASE-18 o DEV-3"}
    validations: {required: true}
  - type: textarea
    id: objective
    attributes: {label: Objective, description: "Capacidad observable."}
    validations: {required: true}
  - type: dropdown
    id: scope
    attributes: {label: Scope, options: [S1, S2, S3]}
    validations: {required: true}
  - type: dropdown
    id: risk
    attributes: {label: Risk, options: [R0, R1, R2, R3]}
    validations: {required: true}
  - type: dropdown
    id: profile
    attributes: {label: Profile, options: [FAST, STANDARD, CRITICAL]}
    validations: {required: true}
  - type: dropdown
    id: finalize_policy
    attributes: {label: Finalize policy, options: [AUTO, HUMAN]}
    validations: {required: true}
  - type: input
    id: base_sha
    attributes: {label: Base SHA, description: "SHA remoto completo."}
    validations: {required: true}
  - type: input
    id: expected_branch
    attributes: {label: Expected branch, placeholder: codex/capability-name}
    validations: {required: true}
  - type: dropdown
    id: writer_role
    attributes: {label: Writer role, description: "Rol único que puede escribir; el modelo/cliente no cambia autoridad.", options: [BUILD, UI_WORKER]}
    validations: {required: true}
  - type: textarea
    id: scope_delta
    attributes:
      label: Semantic scope or strict allowlist
      description: "R3/superficie sensible: strict allowlist. Otro caso: semantic scope, superficies protegidas/prohibidas e invariantes."
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance and negative cases}
    validations: {required: true}
  - type: textarea
    id: capability_delta
    attributes: {label: Capability delta and gates, description: "Sólo capacidades no triviales, gates o excepciones a defaults."}
    validations: {required: true}
