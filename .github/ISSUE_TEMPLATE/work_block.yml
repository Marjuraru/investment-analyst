name: Work Block
description: Define un delta compacto para una capacidad cohesiva
title: "[WORK-BLOCK] "
labels: [workflow:active]
body:
  - type: markdown
    attributes:
      value: "Un único Work Block abierto puede llevar workflow:active. Declare deltas; los defaults viven en docs/development_protocol.md."
  - type: input
    id: work_block
    attributes: {label: Work Block, placeholder: "BASE-18 o DEV-3"}
    validations: {required: true}
  - type: textarea
    id: objective
    attributes: {label: Objective, description: "Capacidad observable."}
    validations: {required: true}
  - type: dropdown
    id: scope
    attributes: {label: Scope, options: [S1, S2, S3]}
    validations: {required: true}
  - type: dropdown
    id: risk
    attributes: {label: Risk, options: [R0, R1, R2, R3]}
    validations: {required: true}
  - type: dropdown
    id: profile
    attributes: {label: Profile, options: [FAST, STANDARD, CRITICAL]}
    validations: {required: true}
  - type: dropdown
    id: finalize_policy
    attributes: {label: Finalize policy, options: [AUTO, HUMAN]}
    validations: {required: true}
  - type: input
    id: base_sha
    attributes: {label: Base SHA, description: "SHA remoto completo."}
    validations: {required: true}
  - type: input
    id: expected_branch
    attributes: {label: Expected branch, placeholder: codex/capability-name}
    validations: {required: true}
  - type: dropdown
    id: writer_role
    attributes: {label: Writer role, description: "Rol único que puede escribir; BUILD_PRODUCT no toca governance, BUILD_GOVERNANCE exige R3/CRITICAL/HUMAN/NONE y snapshot de base, UI_WORKER es producto restringido.", options: [BUILD_PRODUCT, BUILD_GOVERNANCE, UI_WORKER]}
    validations: {required: true}
  - type: textarea
    id: scope_delta
    attributes:
      label: Semantic scope or strict allowlist
      description: "R3/superficie sensible: incluya ## Strict delta allowlist, ## Superficies protegidas y ## Superficies prohibidas con rutas en código y SHA-256/nuevo/deny según el protocolo."
    validations: {required: true}
  - type: textarea
    id: delivery_route_context
    attributes:
      label: Delivery route context
      description: "Horizonte, item(s), route_effect (NONE/ADVANCES/COMPLETES), transición propuesta, siguiente esperado y desviación. Sólo main es integrado; COMPLETES propone DONE/NEXT en el mismo diff."
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance and negative cases, description: "Explique el contrato; el bloque JSON parser-owned siguiente es la fuente ejecutable."}
    validations: {required: true}
  - type: textarea
    id: acceptance_manifest
    attributes:
      label: Acceptance manifest JSON
      description: "Un único JSON canónico workflow-acceptance-manifest-v1 con schema_version, route_effect e items; cada item tiene id, kind y requirements tipados (changed_path, present_path, focused_test, ci, smoke, live_probe, route_transition)."
      value: |
        ```json
        {"schema_version":"workflow-acceptance-manifest-v1","route_effect":"NONE","items":[{"id":"A1","kind":"acceptance","requirements":["changed_path:README.md"]}]}
        ```
    validations: {required: true}
  - type: textarea
    id: capability_delta
    attributes: {label: Capability delta and gates, description: "Sólo capacidades no triviales, gates o excepciones a defaults."}
    validations: {required: true}
