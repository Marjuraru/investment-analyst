[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-analyst"
version = "0.1.0"
description = "Herramienta personal de análisis de inversiones (solo análisis, sin ejecución de órdenes)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "duckdb>=1.5,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10,<3",
    "pytest>=8",
    "pytest-cov>=7.1,<8",
    "ruff>=0.6",
    "scikit-learn>=1.9,<2",
    "setuptools==84.1.0",
    "threadpoolctl>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"investment_analyst.frontend" = ["static/*.html", "static/*.css", "static/*.js"]
"investment_analyst.catalog" = ["default_assets.v1.json"]
"investment_analyst.storage.migrations" = ["001_initial.sql", "002_workspace_v2.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["investment_analyst"]

[tool.coverage.report]
fail_under = 82.0
precision = 2
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
